
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベントリスナの練習</title>

  <style>
    body {
      font-family: sans-serif;
      background-color: #eef5ff;
      text-align: center;
      padding: 30px;
    }

    h1 {
      color: #315b83;
    }

    h2 {
      color: #456987;
      margin-top: 30px;
    }

    button {
      background-color: #4b91c9;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #286b9e;
    }

    p {
      font-size: 18px;
      color: #333;
    }

    .area {
      background-color: white;
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <h1>イベントリスナの練習</h1>

  <div class="area">
    <h2>① イベントハンドラ方式</h2>

    <button onclick="sayHello()">
      挨拶する（ハンドラ）
    </button>

    <p id="message1"></p>
  </div>

  <div class="area">
    <h2>② イベントリスナ方式</h2>

    <button id="listenerBtn">
      挨拶する（リスナ）
    </button>

    <p id="message2"></p>

    <button id="countBtn">
      数える
    </button>

    <p id="count">0</p>
  </div>

  <script>
    // ① イベントハンドラで呼ばれる関数
    function sayHello() {
      document.getElementById("message1").innerText =
        "こんにちは！（ハンドラ）";
    }

    // ② イベントリスナでクリック時の処理を登録
    document.getElementById("listenerBtn")
      .addEventListener("click", function () {
        document.getElementById("message2").innerText =
          "こんにちは！（リスナ）";
      });

    // 数えるための変数
    let count = 0;

    // 数を1増やす関数
    function countUp() {
      count = count + 1;

      document.getElementById("count").innerText = count;
    }

    // 関数の名前だけを渡す（括弧は付けない）
    document.getElementById("countBtn")
      .addEventListener("click", countUp);

  </script>

</body>
</html>
