
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY FIRST GAME</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #eaf6ff;
      margin: 0;
      padding: 30px;
    }

    h1 {
      color: #315b83;
      margin-bottom: 10px;
    }

    p {
      color: #456;
    }

    /* ゲーム画面 */
    #stage {
      width: 600px;
      height: 240px;
      background: linear-gradient(#bde7ff, #effaff);
      border: 4px solid #315b83;
      margin: 20px auto;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
    }

    /* 雲 */
    .cloud {
      position: absolute;
      background-color: white;
      width: 65px;
      height: 22px;
      border-radius: 20px;
      opacity: 0.85;
    }

    #cloud1 {
      top: 35px;
      left: 120px;
    }

    #cloud2 {
      top: 80px;
      left: 410px;
    }

    /* キャラクター */
    #player {
      position: absolute;
      width: 48px;
      height: 48px;
      background-color: #ff7043;
      border: 3px solid #b83d24;
      border-radius: 10px;
      box-sizing: border-box;
      left: 50px;
      top: 96px;
    }

    #player::after {
      content: "●";
      color: white;
      font-size: 12px;
      position: absolute;
      top: 10px;
      left: 15px;
    }

    .instructions {
      margin-top: 15px;
      color: #315b83;
    }
  </style>
</head>

<body>

  <h1>MY FIRST GAME</h1>
  <p>キャラクターを操作してみよう！</p>

  <div id="stage">
    <div class="cloud" id="cloud1"></div>
    <div class="cloud" id="cloud2"></div>
    <div id="player"></div>
  </div>

  <div class="instructions">
    <p>移動：↑ ↓ ← → または W A S D</p>
  </div>

  <script>
    // キャラクターの要素
    const player = document.getElementById("player");

    // キャラクターの位置
    let x = 50;
    let y = 96;

    // 移動速度
    const speed = 2;

    // キーの状態を保存する
    const keys = {};

    // キーを押したとき
    document.addEventListener("keydown", (e) => {
      keys[e.code] = true;
    });

    // キーを離したとき
    document.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    // キャラクターの状態を更新する
    function update() {

      // 右に移動
      if (keys["ArrowRight"] || keys["KeyD"]) {
        x = x + speed;
      }

      // 左に移動
      if (keys["ArrowLeft"] || keys["KeyA"]) {
        x = x - speed;
      }

      // 上に移動
      if (keys["ArrowUp"] || keys["KeyW"]) {
        y = y - speed;
      }

      // 下に移動
      if (keys["ArrowDown"] || keys["KeyS"]) {
        y = y + speed;
      }

      // 画面の左端で止める
      if (x < 0) {
        x = 0;
      }

      // 画面の右端で止める
      if (x > 600 - 48) {
        x = 600 - 48;
      }

      // 画面の上端で止める
      if (y < 0) {
        y = 0;
      }

      // 画面の下端で止める
      if (y > 240 - 48) {
        y = 240 - 48;
      }

      // 表示を更新する
      draw();
    }

    // キャラクターを画面に表示する
    function draw() {
      player.style.left = x + "px";
      player.style.top = y + "px";
    }

    // 16ミリ秒ごとにupdateを実行する
    setInterval(update, 16);

    // 最初の表示
    draw();

  </script>

</body>
</html>
