<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>keysオブジェクトで動かす</title>

  <style>
    body {
      font-family: sans-serif;
    }

    .stage {
      position: relative;
      width: 600px;
      height: 240px;
      margin: 24px auto;
      border: 2px solid #333;
      background: #f6f8ff;
      overflow: hidden;
    }

    #box {
      position: absolute;
      width: 48px;
      height: 48px;
      background: #ff6b6b;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h2 style="text-align: center;">キーボードで四角を動かす</h2>

  <p style="text-align: center;">
    ← → ↑ ↓ で赤い四角が動きます
  </p>

  <div class="stage" id="stage">
    <div id="box"></div>
  </div>

  <script>
    const box = document.getElementById("box");

    let x = 50;          // 横の位置（状態）
    let y = 96;          // 縦の位置（状態）
    const speed = 4;     // 1回に動く量

    const keys = {};     // 押されているキーを覚える入れ物

    // キーを押したらtrueを記録する
    document.addEventListener("keydown", (e) => {
      keys[e.code] = true;
    });

    // キーを離したらfalseを記録する
    document.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    // 状態（x, y）から表示を決める
    function draw() {
      box.style.left = x + "px";
      box.style.top = y + "px";
    }

    // 一定の間隔で、押されているキーを見て動かす
    function update() {
      if (keys["ArrowRight"]) {
        x = x + speed;
      }

      if (keys["ArrowLeft"]) {
        x = x - speed;
      }

      if (keys["ArrowDown"]) {
        y = y + speed;
      }

      if (keys["ArrowUp"]) {
        y = y - speed;
      }

      draw();
    }

    // updateを16ミリ秒ごとに呼び出す
    setInterval(update, 16);
  </script>
</body>
</html>
